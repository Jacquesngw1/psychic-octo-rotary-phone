name: Neuralis Black CI/CD

on:
  push:
    branches: [main]
    paths:
      - "neuralis-black-platform/**"
  pull_request:
    branches: [main]
    paths:
      - "neuralis-black-platform/**"

jobs:
  ci:
    name: Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: neuralis-black-platform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: neuralis-black-platform/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Build packages
        run: npm run build

      - name: Run tests
        run: npm test

  deploy:
    name: Deploy
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    defaults:
      run:
        working-directory: neuralis-black-platform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy placeholder
        run: echo "Deployment step - configure with your cloud provider credentials"
